<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CakeMe — Торт</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .product-page { padding-top: 120px; padding-bottom: 80px; min-height: 100vh; background: var(--bg-light, #FFF9F5); }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .back-link { display: inline-block; margin-bottom: 30px; color: #8B5A2B; text-decoration: none; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
        .product-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; background: white; border-radius: 32px; padding: 40px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); margin-bottom: 70px; }
        .product-detail-image img { width: 100%; border-radius: 24px; }
        .product-detail-info h1 { font-family: 'Playfair Display', serif; font-size: 42px; color: #3E2723; margin-bottom: 16px; }
        .product-detail-price { font-size: 34px; font-weight: 700; color: #8B5A2B; margin-bottom: 24px; }
        .product-detail-desc { color: #5D4037; line-height: 1.7; margin-bottom: 28px; }
        .product-specs { display: flex; gap: 15px; margin-bottom: 35px; flex-wrap: wrap; }
        .spec { background: #FFF5F0; padding: 8px 20px; border-radius: 40px; font-size: 14px; color: #3E2723; }
        .additional-info { background: #FFF5F0; border-radius: 24px; padding: 24px; margin-top: 30px; }
        .additional-info h3 { font-family: 'Playfair Display', serif; font-size: 22px; color: #3E2723; margin-bottom: 20px; }
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .info-item { display: flex; justify-content: space-between; border-bottom: 1px dashed #D4A574; padding-bottom: 8px; margin-bottom: 8px; }
        .info-label { font-weight: 600; color: #3E2723; }
        .info-value { color: #5D4037; }
        .btn-order-large { background: #8B5A2B; color: white; border: none; padding: 16px 40px; border-radius: 50px; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-top: 10px; }
        .btn-order-large:hover { background: #5D4037; transform: translateY(-2px); }
        .similar-title { font-family: 'Playfair Display', serif; font-size: 32px; color: #3E2723; margin-bottom: 35px; text-align: center; }
        .similar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; }
        .similar-card { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #f0e0d4; transition: all 0.3s; text-decoration: none; display: block; }
        .similar-card:hover { transform: translateY(-6px); box-shadow: 0 12px 25px rgba(0,0,0,0.1); }
        .similar-card img { width: 100%; height: 200px; object-fit: cover; }
        .similar-info { padding: 18px; }
        .similar-info h4 { font-family: 'Playfair Display', serif; font-size: 18px; color: #3E2723; margin-bottom: 8px; }
        .similar-price { font-weight: 700; color: #8B5A2B; font-size: 18px; }
        @media (max-width: 768px) {
            .product-detail { grid-template-columns: 1fr; padding: 24px; }
            .similar-grid { grid-template-columns: 1fr; }
            .product-page { padding-top: 100px; }
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">CakeMe</a>
                <ul class="nav-links">
                    <li><a href="index.html#catalog">Каталог</a></li>
                    <li><a href="index.html#reviews">Отзывы</a></li>
                    <li><a href="index.html#footer">Контакты</a></li>
                    <li><a href="#" class="btn-nav" id="orderBtnNav">Заказать</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="product-page">
        <div class="container">
            <a href="index.html" class="back-link">← Назад в каталог</a>
            <div id="productDetail"></div>
            <h2 class="similar-title">🍰 Вам также понравится</h2>
            <div class="similar-grid" id="similarGrid"></div>
        </div>
    </main>

    <footer id="footer">
        <div class="container">
            <div class="footer-brand">CakeMe</div>
            <div class="contacts" id="footerContacts">Загрузка...</div>
        </div>
    </footer>

    <div class="modal-overlay" id="orderModal">
        <div class="modal">
            <button class="btn-close" onclick="closeOrderModal()">✕</button>
            <div id="orderForm">
                <h3>📋 Заказать торт</h3>
                <div class="cake-info" id="modalCakeInfo"></div>
                <input type="text" id="orderName" placeholder="Ваше имя">
                <input type="tel" id="orderPhone" placeholder="Телефон">
                <textarea id="orderMessage" placeholder="Комментарий (необязательно)"></textarea>
                <button class="btn-submit" onclick="submitOrder()">🚀 Отправить заказ</button>
            </div>
            <div class="success-msg" id="orderSuccess">
                <h3>✅ Заказ принят!</h3>
                <p>Мы свяжемся с вами в ближайшее время.</p>
                <button class="btn-submit" onclick="closeOrderModal()">Хорошо</button>
            </div>
        </div>
    </div>

    <script>
        const API = "";

        // Функция для генерации описания на основе названия торта
        function generateDescription(cakeName, weight, persons) {
            const descriptions = {
                "Медовик": "Нежный медовый торт с прослойкой из сметанного крема. Настоящее домашнее лакомство, знакомое с детства. Натуральный мёд придаёт неповторимый аромат, а воздушные коржи тают во рту.",
                "Наполеон": "Хрустящие слоёные коржи с нежнейшим заварным кремом. Классический рецепт, проверенный временем. Идеальный баланс хруста и нежности.",
                "Красный бархат": "Бархатистый красный бисквит с сырным кремом. Эффектный внешний вид и невероятно нежный вкус. Идеален для романтического вечера.",
                "Чизкейк": "Нежный творожный чизкейк с тонкой песочной основой. Лёгкий, воздушный, с едва уловимой ноткой ванили. Настоящее наслаждение.",
                "Прага": "Шоколадный бисквит с масляным кремом и шоколадной глазурью. Для настоящих ценителей шоколада. Глубокий, насыщенный вкус.",
                "Тирамису": "Итальянский десерт с маскарпоне и кофейной пропиткой. Нежный, ароматный, с лёгкой горчинкой кофе. Путешествие в Италию за один укус."
            };
            if (descriptions[cakeName]) return descriptions[cakeName];
            return `${cakeName} — авторский торт из натуральных ингредиентов. Ручная работа, уникальный дизайн. Вес ${weight} кг, рассчитан на ${persons} персон. Идеальный десерт для вашего праздника.`;
        }

        // Функция для генерации состава
        function generateIngredients(cakeName) {
            const ingredients = {
                "Медовик": "Мука пшеничная, мёд натуральный, яйца, сахар, масло сливочное, сметана (30%), ванилин.",
                "Наполеон": "Мука пшеничная, масло сливочное, яйца, соль, молоко, сахар, ванильный сахар, крахмал.",
                "Красный бархат": "Мука пшеничная, масло сливочное, сахар, яйца, какао-порошок, пахта, пищевой краситель красный, сыр сливочный, сливки.",
                "Чизкейк": "Печенье песочное, масло сливочное, сыр творожный, сахар, яйца, сливки 33%, ванильный экстракт, мука кукурузная.",
                "Прага": "Мука пшеничная, сахар, яйца, какао-порошок, масло сливочное, сгущённое молоко, шоколад тёмный.",
                "Тирамису": "Печенье савоярди, сыр маскарпоне, яйца, сахар, кофе эспрессо, какао-порошок, ликёр (опционально)."
            };
            if (ingredients[cakeName]) return ingredients[cakeName];
            return "Мука пшеничная, масло сливочное, сахар, яйца, натуральные ароматизаторы, крем на основе сливочного сыра.";
        }

        // Генерация калорий на основе веса
        function getCalories(weight) {
            const avgCaloriesPer100g = 380;
            const total = Math.round(parseFloat(weight) * avgCaloriesPer100g * 10);
            return `${total.toLocaleString()} ккал (~${avgCaloriesPer100g} ккал/100г)`;
        }

        // Время изготовления
        function getCookingTime(cakeName) {
            const times = {
                "Медовик": "3 часа",
                "Наполеон": "4 часа",
                "Красный бархат": "2.5 часа",
                "Чизкейк": "2 часа (+4 часа охлаждения)",
                "Прага": "2 часа",
                "Тирамису": "1.5 часа (+3 часа пропитки)"
            };
            return times[cakeName] || "2-3 часа";
        }

        // Артикул
        function getSKU(id, cakeName) {
            const prefix = cakeName.substring(0, 3).toUpperCase();
            return `CK-${prefix}-${id.toString().padStart(4, '0')}`;
        }

        let allCakes = [];

        function loadCakes() {
            return fetch(API + "/cakes")
                .then(r => r.json())
                .then(cakes => {
                    allCakes = cakes;
                    return cakes;
                })
                .catch(() => {
                    allCakes = [
                        { id: 1, name: "Медовик", price: 2450, weight: "1.2", persons: "4-6", category: "Классический", image_url: "photos/p1.png", is_available: true },
                        { id: 2, name: "Наполеон", price: 2890, weight: "1.5", persons: "6-8", category: "Классический", image_url: "photos/p2.png", is_available: true },
                        { id: 3, name: "Красный бархат", price: 3250, weight: "1.3", persons: "5-7", category: "Авторский", image_url: "photos/p3.png", is_available: true },
                        { id: 4, name: "Чизкейк", price: 2670, weight: "1.0", persons: "4-5", category: "Авторский", image_url: "photos/p4.png", is_available: true },
                        { id: 5, name: "Прага", price: 2980, weight: "1.2", persons: "5-6", category: "Шоколадный", image_url: "photos/p5.png", is_available: true },
                        { id: 6, name: "Тирамису", price: 3450, weight: "1.1", persons: "4-5", category: "Итальянский", image_url: "photos/p6.png", is_available: true }
                    ];
                    return allCakes;
                });
        }

        function getCakeIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return parseInt(params.get('id'));
        }

        function renderProductPage(cakes) {
            const cakeId = getCakeIdFromURL();
            const cake = cakes.find(c => c.id === cakeId);
            if (!cake) {
                document.getElementById('productDetail').innerHTML = '<p style="text-align:center;">Торт не найден</p>';
                return;
            }

            const ingredients = generateIngredients(cake.name);
            const calories = getCalories(cake.weight);
            const cookingTime = getCookingTime(cake.name);
            const sku = getSKU(cake.id, cake.name);

            document.title = `CakeMe — ${cake.name}`;

            const html = `
                <div class="product-detail">
                    <div class="product-detail-image">
                        <img src="${cake.image_url || 'photos/p1.png'}" alt="${cake.name}" onerror="this.src='https://placehold.co/600x400/FFF5F0/8B5A2B?text=${cake.name}'">
                    </div>
                    <div class="product-detail-info">
                        <h1>${cake.name}</h1>
                        <div class="product-detail-price">${cake.price.toLocaleString()} ₽</div>
                        <div class="product-detail-desc">${cake.category || 'Авторский торт'} — ручная работа. Вес ${cake.weight} кг, на ${cake.persons} персон. Натуральные ингредиенты, уникальный дизайн.</div>
                        <div class="product-specs">
                            <span class="spec">⚖️ Вес: ${cake.weight} кг</span>
                            <span class="spec">👥 На ${cake.persons} персон</span>
                            <span class="spec">🍰 ${cake.category || 'Авторский торт'}</span>
                        </div>
                        <button class="btn-order-large" onclick='openOrderModal(${cake.id}, "${cake.name}", ${cake.price})'>🛒 Заказать сейчас</button>

                        <div class="additional-info">
                            <h3>📋 Подробнее о торте</h3>
                            <div class="info-grid">
                                <div class="info-item"><span class="info-label">📝 Состав:</span><span class="info-value">${ingredients}</span></div>
                                <div class="info-item"><span class="info-label">🔥 Калорийность:</span><span class="info-value">${calories}</span></div>
                                <div class="info-item"><span class="info-label">⏱️ Время изготовления:</span><span class="info-value">${cookingTime}</span></div>
                                <div class="info-item"><span class="info-label">🔖 Артикул:</span><span class="info-value">${sku}</span></div>
                                <div class="info-item"><span class="info-label">🚚 Доставка:</span><span class="info-value">Бесплатно при заказе от 3000 ₽</span></div>
                                <div class="info-item"><span class="info-label">❄️ Хранение:</span><span class="info-value">в холодильнике до 72 часов</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('productDetail').innerHTML = html;
            renderSimilarCakes(cakes, cake.id);
        }

        function renderSimilarCakes(cakes, currentId) {
            const similar = cakes.filter(c => c.id !== currentId).slice(0, 3);
            let html = '';
            similar.forEach(cake => {
                html += `
                    <a href="product.html?id=${cake.id}" class="similar-card">
                        <img src="${cake.image_url || 'photos/p1.png'}" alt="${cake.name}" onerror="this.src='https://placehold.co/400x300/FFF5F0/8B5A2B?text=${cake.name}'">
                        <div class="similar-info">
                            <h4>${cake.name}</h4>
                            <div class="similar-price">${cake.price.toLocaleString()} ₽</div>
                        </div>
                    </a>
                `;
            });
            document.getElementById('similarGrid').innerHTML = html || '<p style="text-align:center;color:#999;">Скоро появятся новые торты</p>';
        }

        function loadSettings() {
            fetch(API + "/settings")
                .then(r => r.json())
                .then(s => {
                    if (s.head) {
                        document.querySelector(".logo").textContent = s.head;
                        document.querySelector(".footer-brand").textContent = s.head;
                    }
                    if (s.phone) {
                        document.getElementById("footerContacts").innerHTML = `
                            <span>📍 ${s.address || ''}</span>
                            <span>📞 ${s.phone || ''}</span>
                            <span>✉️ ${s.email || ''}</span>
                            <span>🕐 ${s.working_hours || ''}</span>
                        `;
                    }
                })
                .catch(() => {
                    document.getElementById("footerContacts").innerHTML = `📍 Москва, ул. Тверская 15 | 📞 +7 (999) 123-45-67 | ✉️ info@cakeme.ru | 🕐 Ежедневно 10:00-21:00`;
                });
        }

        let currentCakeId = null;

        function openOrderModal(cakeId, cakeName, cakePrice) {
            currentCakeId = cakeId;
            document.getElementById("modalCakeInfo").innerHTML = `<strong>${cakeName}</strong><br>Цена: ${cakePrice.toLocaleString()} ₽`;
            document.getElementById("orderForm").style.display = "block";
            document.getElementById("orderSuccess").style.display = "none";
            document.getElementById("orderModal").classList.add("active");
        }

        function closeOrderModal() {
            document.getElementById("orderModal").classList.remove("active");
            document.getElementById("orderName").value = "";
            document.getElementById("orderPhone").value = "";
            document.getElementById("orderMessage").value = "";
        }

       function submitOrder() {
    let name = document.getElementById("orderName").value;
    let phone = document.getElementById("orderPhone").value;
    let message = document.getElementById("orderMessage").value;

    if (!name || !phone) {
        alert("Пожалуйста, заполните имя и телефон");
        return;
    }

    const cakeInfo = document.getElementById("modalCakeInfo").innerHTML;
    let cakeName = "Торт";
    let cakePrice = 0;

    const matchName = cakeInfo.match(/<strong>(.*?)<\/strong>/);
    if (matchName) cakeName = matchName[1];

    const matchPrice = cakeInfo.match(/Цена: ([\d\s]+) ₽/);
    if (matchPrice) cakePrice = matchPrice[1].replace(/\s/g, '');

    fetch("https://formspree.io/f/xpqezbyv", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"      // ← ЭТА СТРОКА
        },
        body: JSON.stringify({
            name: name,
            phone: phone,
            cake: cakeName,
            price: cakePrice,
            message: message,
            _subject: "🛒 НОВЫЙ ЗАКАЗ С САЙТА"
        })
    })
    .then(response => {
        if (response.ok) {
            alert("✅ Заказ отправлен! Мы свяжемся с вами.");
            document.getElementById("orderForm").style.display = "none";
            document.getElementById("orderSuccess").style.display = "block";

            document.getElementById("orderName").value = "";
            document.getElementById("orderPhone").value = "";
            document.getElementById("orderMessage").value = "";
        } else {
            alert("❌ Ошибка отправки. Попробуйте позже.");
        }
    })
    .catch(error => {
        console.error("Ошибка:", error);
        alert("❌ Ошибка отправки. Проверьте интернет.");
    });
}
        loadCakes().then(cakes => renderProductPage(cakes));
        loadSettings();

        document.getElementById('orderBtnNav')?.addEventListener('click', (e) => {
            e.preventDefault();
            currentCakeId = null;
            document.getElementById("modalCakeInfo").innerHTML = `Выберите торт в каталоге`;
            document.getElementById("orderForm").style.display = "block";
            document.getElementById("orderSuccess").style.display = "none";
            document.getElementById("orderModal").classList.add("active");
        });
    </script>
</body>
</html>
